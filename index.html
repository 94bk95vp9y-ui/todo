<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tagwerk</title>
  <meta name="description" content="Tagwerk – dein Tag als Sonnenbogen. Persönlicher Tagesplaner.">
  <meta name="theme-color" content="#1C5CC8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tagwerk">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="sky" id="sky">
      <div class="stars" id="stars" aria-hidden="true"></div>
      <div class="cloud c1" aria-hidden="true"></div>
      <div class="cloud c2" aria-hidden="true"></div>
      <div class="cloud c3" aria-hidden="true"></div>
      <div class="sky-inner" id="skyInner">
        <nav class="daynav" id="daynav" aria-label="Tag wählen">
          <button class="nav-btn" id="prevDay" aria-label="Vorheriger Tag"></button>
          <button class="day-label" id="dayLabel"></button>
          <button class="nav-btn" id="nextDay" aria-label="Nächster Tag"></button>
          <span class="spacer"></span>
          <button class="pill-btn" id="todayBtn" hidden>Heute</button>
          <button class="nav-btn" id="moreBtn" aria-label="Rückblick und Einstellungen"></button>
        </nav>
        <div class="arc-wrap">
          <svg id="arc" viewBox="0 0 390 250" aria-hidden="true"></svg>
          <div class="sky-head" aria-live="polite">
            <h1 id="headline"></h1>
            <p id="subline"></p>
          </div>
        </div>
      </div>
    </header>
    <div class="scrim" aria-hidden="true"></div>

    <main class="ground" id="ground">
      <svg class="ground-hill" viewBox="0 0 390 46" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 22C48 6 104 0 166 14S282 36 330 22S374 8 390 12V46H0Z"/>
      </svg>
      <div id="view"></div>
    </main>

    <nav class="dock" id="dock" aria-label="Hauptnavigation">
      <button class="tab" data-tab="day" id="tabDay"><span class="ico"></span><span id="tabDayLbl">Heute</span></button>
      <button class="add" id="addBtn" aria-label="Aufgabe hinzufügen"><span class="rays" aria-hidden="true"></span><span class="ico"></span></button>
      <button class="tab" data-tab="inbox" id="tabInbox"><span class="ico"></span><span>Eingang</span><b class="badge" id="inboxBadge" hidden></b></button>
    </nav>

    <div id="layer"></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <noscript><p style="padding:40px;font-family:sans-serif">Tagwerk braucht JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
